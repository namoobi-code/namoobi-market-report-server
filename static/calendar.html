<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>📅 이벤트 캘린더 — namoobi 투자 인텔리전스</title>
<style>
  :root{--bg:#f6f7f9;--tx:#0f172a;--tx2:#475569;--line:#e2e8f0;--blue:#1e40af;--teal:#0e7490}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
    font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;font-size:14px}
  .wrap{max-width:980px;margin:0 auto;padding:18px 14px 60px}
  header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  h1{font-size:20px;margin:0}
  a.back{font-size:12.5px;padding:6px 13px;border-radius:999px;background:#fff;border:1px solid var(--line);
    color:var(--tx2);text-decoration:none}
  .note{color:#94a3b8;font-size:12px}
  h2{font-size:15px;margin:22px 0 8px;color:var(--blue)}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}
  th{background:#eef2ff;color:#1e3a8a;font-size:12.5px}
  tr:last-child td{border-bottom:none}
  .dday{display:inline-block;min-width:44px;text-align:center;padding:2px 7px;border-radius:999px;
    font-size:11.5px;font-weight:700;background:#e0f2fe;color:#075985}
  .dday.today{background:#dc2626;color:#fff}
  .dday.soon{background:#f59e0b;color:#fff}
  .imp3{color:#dc2626;font-weight:700}.imp2{color:#d97706;font-weight:600}.imp1{color:#64748b}
  .region{display:inline-block;padding:1px 8px;border-radius:6px;background:#f1f5f9;font-size:11.5px;color:#334155}
  .src{color:#94a3b8;font-size:11px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="index.html">← 대시보드</a>
    <h1>📅 주요 이벤트 캘린더</h1>
    <span class="note" id="asof"></span>
  </header>
  <div class="note">🖥 서버 자동 갱신(매일 05:45·16:05) — FRED 공식 발표일정(실측) + FOMC DB + 중앙은행 회의 + 만기 규칙 + 직전 보고서 검증 이벤트</div>

  <h2>다가오는 이벤트</h2>
  <table id="t_up"><tr><th style="width:120px">날짜</th><th style="width:70px">지역</th><th>이벤트</th><th style="width:70px">중요도</th><th style="width:190px">출처</th></tr></table>

  <h2>중장기 (★★★만)</h2>
  <table id="t_lt"><tr><th style="width:120px">날짜</th><th style="width:70px">지역</th><th>이벤트</th><th style="width:70px">중요도</th><th style="width:190px">출처</th></tr></table>
</div>
<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const impCls=s=>String(s||'').includes('★★★')?'imp3':(String(s||'').includes('★★')?'imp2':'imp1');
function dday(d){
  try{const t=new Date();t.setHours(0,0,0,0);
    const e=new Date(d+'T00:00:00');const n=Math.round((e-t)/86400000);
    if(n===0)return '<span class="dday today">TODAY</span>';
    if(n>0&&n<=3)return `<span class="dday soon">D-${n}</span>`;
    if(n>0)return `<span class="dday">D-${n}</span>`;
    return `<span class="dday" style="background:#f1f5f9;color:#94a3b8">지남</span>`;
  }catch(e){return ''}}
function row(r){
  const wd=(d=>{try{return ['일','월','화','수','목','금','토'][new Date(d+'T00:00:00').getDay()]}catch(e){return ''}})(r.date);
  return `<tr><td><b>${esc((r.date||'').slice(5))}</b><span class="note">(${wd})</span> ${dday(r.date)}</td>
    <td><span class="region">${esc(r.region||'-')}</span></td>
    <td>${esc(r.event||'')}</td>
    <td class="${impCls(r.importance)}">${esc(r.importance||'')}</td>
    <td class="src">${esc(r.source||'')}</td></tr>`;}
fetch('/api/db/events_calendar').then(r=>r.json()).then(d=>{
  document.getElementById('asof').textContent='갱신: '+(d.as_of||'');
  const today=new Date().toISOString().slice(0,10);
  const up=(d.upcoming||[]).filter(r=>r.date>=today);
  document.getElementById('t_up').insertAdjacentHTML('beforeend', up.map(row).join('')||'<tr><td colspan="5" class="note">데이터 없음</td></tr>');
  const lt=(d.longterm||[]);
  document.getElementById('t_lt').insertAdjacentHTML('beforeend', lt.map(row).join('')||'<tr><td colspan="5" class="note">데이터 없음</td></tr>');
}).catch(e=>{document.getElementById('asof').textContent='로드 실패: '+e;});
</script>
</body>
</html>
